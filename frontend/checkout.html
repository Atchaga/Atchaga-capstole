<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
    <div id="site-header"></div>

    <main class="container am-section">
        <h3 class="am-section-title">Checkout</h3>

        <div id="checkoutContent">
            <div class="row g-4">
                <!-- Customer Details -->
                <div class="col-lg-7">
                    <div class="am-filter-card" style="margin-bottom: 0;">
                        <h6>Customer Details</h6>
                        <form id="checkoutForm" novalidate>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="am-form-group">
                                        <label for="checkoutName">Full Name *</label>
                                        <input type="text" class="am-form-control" id="checkoutName" placeholder="Your full name" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="am-form-group">
                                        <label for="checkoutEmail">Email Address *</label>
                                        <input type="email" class="am-form-control" id="checkoutEmail" placeholder="you@example.com" required>
                                    </div>
                                </div>
                            </div>
                            <div class="am-form-group">
                                <label for="checkoutPhone">Phone Number</label>
                                <input type="tel" class="am-form-control" id="checkoutPhone" placeholder="10-digit mobile number" maxlength="10">
                            </div>
                            <div class="am-form-group">
                                <label for="checkoutAddress">Shipping Address *</label>
                                <textarea class="am-form-control" id="checkoutAddress" rows="3" placeholder="House no, Street, City, State, PIN code" required></textarea>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Order Summary -->
                <div class="col-lg-5">
                    <div class="am-cart-summary" style="position: static;">
                        <div id="checkoutSummary">
                            <div class="am-loading-text" style="padding: 20px;">Loading summary... <span class="spinner-border spinner-border-sm"></span></div>
                        </div>
                        <button class="am-btn am-btn-accent w-100 mt-3" id="placeOrderBtn" style="padding: 13px; font-size: 1rem;">
                            ✅ Place Order
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
