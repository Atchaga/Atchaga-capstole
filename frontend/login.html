<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
    <div id="site-header"></div>

    <main class="container">
        <div class="am-auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Login to your ATCHAGA MART account</p>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm" novalidate>
                <div class="am-form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" class="am-form-control" id="loginEmail" placeholder="you@example.com" required>
                </div>
                <div class="am-form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" class="am-form-control" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="am-btn am-btn-accent w-100" style="padding: 12px;">Login</button>
            </form>

            <div class="am-auth-footer">
                <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">Forgot Password?</a>
                <hr class="my-3">
                New to ATCHAGA MART? <a href="register.html">Create an account</a>
            </div>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Reset Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small mb-3">Enter your registered email address and we'll send you a password reset link.</p>
                    <form id="forgotPasswordForm" novalidate>
                        <div class="am-form-group">
                            <label for="forgotEmail">Email Address</label>
                            <input type="email" class="am-form-control" id="forgotEmail" placeholder="you@example.com" required>
                        </div>
                        <button type="submit" class="am-btn am-btn-accent w-100">Send Reset Link</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
