# ============================================================
# ATCHAGA MART - Application Configuration
# Uses H2 embedded database so the app runs with ZERO setup.
# ============================================================

spring.application.name=atchaga-mart
server.port=8080

# ------------------------------------------------------------
# H2 Embedded Database (in-memory, auto-created)
# ------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:atchaga_mart;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ------------------------------------------------------------
# JPA / Hibernate Configuration
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ------------------------------------------------------------
# SQL Initialization (auto-run schema.sql and data.sql)
# ------------------------------------------------------------
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ------------------------------------------------------------
# H2 Console (optional - http://localhost:8080/h2-console)
# ------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# JWT Configuration
# ------------------------------------------------------------
atchaga.jwt.secret=${JWT_SECRET}
atchaga.jwt.expiration=86400000
