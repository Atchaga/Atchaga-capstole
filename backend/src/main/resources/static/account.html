<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="account">
    <div id="site-header"></div>

    <main class="container am-section">
        <h3 class="am-section-title">My Account</h3>

        <div class="row g-4">
            <!-- Profile Section -->
            <div class="col-lg-4" id="profileSection">
                <div class="am-loading-text" style="padding: 30px;">Loading profile... <span class="spinner-border spinner-border-sm"></span></div>
            </div>

            <!-- Order History -->
            <div class="col-lg-8" id="orders">
                <h5 class="fw-bold mb-3">Order History</h5>
                <div id="orderHistory">
                    <div class="am-loading-text" style="padding: 30px;">Loading orders... <span class="spinner-border spinner-border-sm"></span></div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/account.js"></script>
<script src="js/chatbot.js"></script>`n</body>
</html>
