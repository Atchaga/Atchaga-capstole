<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="products">
    <div id="site-header"></div>

    <main class="container am-section">
        <div class="row">
            <!-- Filters Sidebar -->
            <div class="col-lg-3 mb-4">
                <div class="am-filter-card">
                    <h6>Search</h6>
                    <input type="text" class="am-form-control" id="filterSearch" placeholder="Search products...">
                </div>

                <div class="am-filter-card">
                    <h6>Categories</h6>
                    <div id="categoryFilters">
                        <span class="text-muted small">Loading...</span>
                    </div>
                </div>

                <div class="am-filter-card">
                    <h6>Price Range (₹)</h6>
                    <div class="d-flex gap-2">
                        <input type="number" class="am-form-control" id="filterMinPrice" placeholder="Min" min="0">
                        <input type="number" class="am-form-control" id="filterMaxPrice" placeholder="Max" min="0">
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button class="am-btn am-btn-accent" id="applyFilters">Apply Filters</button>
                    <button class="am-btn am-btn-outline" id="clearFilters">Clear All</button>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                    <h5 class="fw-bold mb-0" id="resultsCount">Loading...</h5>
                    <div class="d-flex align-items-center gap-2">
                        <label for="sortSelect" class="small fw-semibold text-nowrap">Sort by:</label>
                        <select class="form-select form-select-sm" id="sortSelect" style="width: auto;">
                            <option value="asc">Relevance</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="rating">Top Rated</option>
                            <option value="name">Name: A to Z</option>
                            <option value="newest">Newest First</option>
                        </select>
                    </div>
                </div>

                <div class="row" id="productsGrid">
                    <div class="col-12"><div class="am-loading-text">Loading products... <span class="spinner-border spinner-border-sm"></span></div></div>
                </div>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/products.js"></script>
<script src="js/chatbot.js"></script>`n</body>
</html>
