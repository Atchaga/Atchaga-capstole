<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register">
    <div id="site-header"></div>

    <main class="container">
        <div class="am-auth-card">
            <h2>Create Account</h2>
            <p class="auth-subtitle">Join ATCHAGA MART - Shop Smart. Shop More. Easy Shopping.</p>

            <form id="registerForm" novalidate>
                <div class="am-form-group">
                    <label for="regRole">Account Type *</label>
                    <select class="am-form-control" id="regRole" required>
                        <option value="">Select account type</option>
                        <option value="USER">Customer (User)</option>
                        <option value="SELLER">Seller</option>
                    </select>
                </div>
                <div class="am-form-group">
                    <label for="regName">Full Name *</label>
                    <input type="text" class="am-form-control" id="regName" placeholder="Enter your full name" required>
                </div>
                <div class="am-form-group">
                    <label for="regEmail">Email Address *</label>
                    <input type="email" class="am-form-control" id="regEmail" placeholder="you@example.com" required>
                </div>
                <div class="am-form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" class="am-form-control" id="regPhone" placeholder="10-digit mobile number" maxlength="10">
                </div>
                <div class="am-form-group">
                    <label for="regPassword">Password *</label>
                    <input type="password" class="am-form-control" id="regPassword" placeholder="Minimum 6 characters" required>
                </div>
                <div class="am-form-group">
                    <label for="regConfirmPassword">Confirm Password *</label>
                    <input type="password" class="am-form-control" id="regConfirmPassword" placeholder="Re-enter your password" required>
                </div>
                <div class="am-form-group">
                    <label for="regAddress">Address</label>
                    <textarea class="am-form-control" id="regAddress" rows="2" placeholder="Your delivery address (optional)"></textarea>
                </div>
                <button type="submit" class="am-btn am-btn-accent w-100" style="padding: 12px;">Create Account</button>
            </form>

            <div class="am-auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
<script src="js/chatbot.js"></script>`n</body>
</html>
