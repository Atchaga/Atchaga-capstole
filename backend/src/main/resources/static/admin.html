<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ATCHAGA MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin">
    <div id="site-header"></div>

    <main class="container am-section">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h3 class="am-section-title mb-0">Admin Dashboard</h3>
            <div class="d-flex gap-2 flex-wrap">
                <button class="am-btn am-btn-accent" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('summary')">Summary</button>
                <button class="am-btn am-btn-accent" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('users')">Users</button>
                <button class="am-btn am-btn-accent" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('products')">Products</button>
                <button class="am-btn am-btn-accent" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('orders')">Orders</button>
                <button class="am-btn am-btn-accent" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('carts')">Carts</button>
                <button class="am-btn am-btn-primary-custom" style="padding: 8px 16px; font-size: 0.85rem;" onclick="showSection('database')">DB Viewer</button>
            </div>
        </div>

        <div id="adminContent" class="mt-4">
            <div class="am-loading-text">Loading dashboard... <span class="spinner-border spinner-border-sm"></span></div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
<script src="js/chatbot.js"></script>`n</body>
</html>
